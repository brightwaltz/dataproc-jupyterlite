name: Build and deploy JupyterLite to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Build (notebooks/ と data/ のフォルダ構成を保つ)
        run: |
          rm -rf _stage _output .jupyterlite.doit.db
          mkdir -p _stage/notebooks _stage/data
          cp notebooks/*.ipynb _stage/notebooks/
          cp data/*.csv data/*.ttf data/SOURCES.md data/OFL_*.txt _stage/data/
          jupyter lite build --contents _stage --output-dir _output
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _output
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
